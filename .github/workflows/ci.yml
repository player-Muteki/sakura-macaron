name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 主题自检 (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: 固定快照、产物、对比度与回归测试
        run: npm run verify
      - name: 离线重建不得改变已提交产物
        run: |
          npm run build
          git diff --exit-code -- themes
      - name: 打包检查
        if: runner.os == 'Linux'
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: sakura-macaron-vsix
          path: '*.vsix'
          if-no-files-found: error
